<a href="{{ product.get_absolute_url }}" class="product-card">
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    {% else %}
        <div class="placeholder-img">🍰</div>
    {% endif %}
    <div class="product-card-body">
        {% if explanation %}<span class="badge-ai">AI Pick</span>{% endif %}
        <span class="category-tag">{{ product.category.name }}</span>
        <h3>{{ product.name }}</h3>
        <div class="price">${{ product.price }}</div>
        {% if not product.in_stock %}<div class="ai-explanation">Out of stock</div>{% endif %}
        {% if explanation %}<div class="ai-explanation">{{ explanation }}</div>{% endif %}
    </div>
</a>
