{% extends 'base.html' %}
{% block title %}Delete {{ product.name }}{% endblock %}

{% block content %}
<div class="form-card">
    <h1>Delete Product</h1>
    <p>Are you sure you want to delete <strong>{{ product.name }}</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'products:product_dashboard' %}" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
